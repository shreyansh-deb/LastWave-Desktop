name: Build Intel Mac App
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get
      - run: flutter build macos --release
      - run: tar -czf LastWave-Intel.tar.gz -C build/macos/Build/Products/Release LastWave.app
      - uses: actions/upload-artifact@v4
        with:
          name: LastWave-Intel-macOS
          path: LastWave-Intel.tar.gz
